name: Collect
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt pyyaml

      - name: Run Aggregator
        env:
          # 必须用这三个名字，代码里写死了只认这三个！
          GIST_PAT: ${{ secrets.GIST_TOKEN }}  # 这里对应你仓库里存的 Secret 名字
          GIST_LINK: ${{ secrets.GIST_ID }}     # 格式应为: 用户名/GistID
        run: |
          # 命令里必须带上 -g 和 -k 参数，确保它强行执行推送逻辑
          python subscribe/collect.py -g ${{ secrets.GIST_ID }} -k ${{ secrets.GIST_TOKEN }} -t clash vray singbox --skip
