name: Collect
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:      # 确保手动运行按钮存在

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # 额外安装 yaml 解析库，防止脚本报错
          pip install pyyaml 

      - name: Run Aggregator
        env:
          # 这里必须和你 Settings 里的名字一模一样
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        # 核心命令：-s 代表强制搜索模式，--config 指向你根目录的文件
        run: python subscribe/collect.py --config config.yaml -s

      - name: Save Timestamp
        run: date > last_run.txt
