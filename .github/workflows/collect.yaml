name: Collect
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt pyyaml

      - name: Run Aggregator
        env:
          GIST_PAT: ${{ secrets.GIST_TOKEN }}
          GIST_LINK: ${{ secrets.GIST_ID }}
        run: |
          python subscribe/collect.py -g ${{ secrets.GIST_ID }} -k ${{ secrets.GIST_TOKEN }} -t clash v2ray singbox -d 300 --all
